name: backend-ci

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'

defaults:
  run:
    working-directory: backend

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: sector7_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/sector7_test
      SECTOR7_TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/sector7_test
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.11.19'
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - run: uv python install 3.13

      - run: uv sync --frozen

      - run: uv run ruff check .

      - run: uv run python -m compileall -q app tests

      - name: Verify migrations
        run: |
          uv run alembic upgrade head
          uv run alembic check
          uv run alembic downgrade base
          uv run alembic upgrade head

      - name: PostgreSQL tests
        run: uv run pytest

      - name: SQLite tests
        env:
          SECTOR7_TEST_DATABASE_URL: sqlite+aiosqlite://
        run: uv run pytest
